<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>contoh 1 Laporan- 03</title>

  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 40px;
    }
    .btn-primary {
      width: 100%;
    }
    .alert-dismissible {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container form-container">
    <h2 class="text-center mb-4">Laporan Praktikum - 03</h2>

    <!-- Alert Error Placeholder -->
    <div id="alertArea"></div>

    <!-- Alert Ringkasan Data -->
    <div id="outputArea"></div>

    <form id="myForm">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="name" class="form-label">Masukkan Nama:</label>
          <input type="text" class="form-control" id="name" placeholder="Masukkan Nama Kamu" />
        </div>
        <div class="col-md-6">
          <label for="nim" class="form-label">Masukkan NIM:</label>
          <input type="number" class="form-control" id="nim" placeholder="Masukkan NIM Kamu" />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="asal" class="form-label">Masukkan Asal Kamu:</label>
          <input type="text" class="form-control" id="asal" placeholder="Masukkan data di sini" />
        </div>
        <div class="col-md-3">
          <label for="dosen" class="form-label">Pilih Dosen Favorit:</label>
          <select id="dosen" class="form-control">
            <option selected disabled>Pilih salah satu</option>
            <option>Pak Agus Mulyanto</option>
            <option>Bu Yuni Roza</option>
            <option>Bu Yessy Asri</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="tanggal" class="form-label">Pilih Tanggal Lahir anda</label>
          <input type="date" class="form-control" id="tanggal" />
        </div>
      </div>

      <div class="form-group row align-items-center mb-3">
        <label class="font-weight-bold col-md-3">Tulis Hal favorit Kamu:</label>
        <div class="col-md-4">
          <label for="favorite" class="form-label">Masukkan Nama Teman Favorit</label>
          <input type="text" class="form-control" id="favorite" placeholder="Contoh: Budi" />
        </div>
        <div class="col-md-5">
          <label for="ai" class="form-label">Masukkan AI Favorit:</label>
          <input type="text" class="form-control" id="ai" placeholder="Contoh: ChatGPT" />
        </div>
      </div>

      <button type="button" class="btn btn-primary" onclick="showAlert()">Kirim</button>
    </form>
  </div>

<!-- Bootstrap 4 -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
function showError(message) {
  const alertArea = document.getElementById("alertArea");
  alertArea.innerHTML = `
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      ${message}
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  `;
}
    function showAlert() {
  const name = document.getElementById("name").value.trim();
  const nim = document.getElementById("nim").value.trim();
  const tanggal = document.getElementById("tanggal").value.trim();
  const dosen = document.getElementById("dosen").value;
  const asal = document.getElementById("asal").value.trim();
  const favorite = document.getElementById("favorite").value.trim();
  const ai = document.getElementById("ai").value.trim();

  // Bersihkan alert sebelumnya
  document.getElementById("alertArea").innerHTML = '';
  document.getElementById("outputArea").innerHTML = '';

  // Validasi
  if (!name) return showError("Nama belum diisi.");
  if (!nim) return showError("NIM belum diisi.");
  if (!asal) return showError("Asal belum diisi.");
  if (!dosen || dosen === "Pilih salah satu") return showError("Dosen favorit belum dipilih.");
  if (!tanggal) return showError("Tanggal lahir belum diisi.");
  if (!favorite) return showError("Nama teman favorit belum diisi.");
  if (!ai) return showError("AI favorit belum diisi.");

  // Tampilkan data
  const results = [
    `Nama Kamu: ${name}`,
    `NIM Kamu: ${nim}`,
    `Asal Kamu: ${asal}`,
    `Dosen Favorit: ${dosen}`,
    `Tanggal Lahir Kamu: ${tanggal}`,
    `Teman Favorit: ${favorite}`,
    `AI Favorit: ${ai}`,
    `Sukses! Semua data telah dikirim.`
  ];

  const outputArea = document.getElementById("outputArea");

  results.forEach(text => {
    const alert = document.createElement("div");
    alert.className = "alert alert-info alert-dismissible fade show";
    alert.role = "alert";
    alert.innerHTML = `
      ${text}
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    `;
    outputArea.appendChild(alert);
  });

  document.getElementById("myForm").reset();
}

</script>
</body>
</html>
