<!DOCTYPE HTML>
<html>
    <head>
        <title>Registrasi</title>
    </head>
<body>
    <h1>Registrasi Akun</h1>
    <fieldset>
    <legend>Formulir Registrasi</legend> <br>
    <form>
        <label for="nama">Masukkan nama:</label>
        <input type="text" id="nama" name="nama" placeholder="Ida Ayu Satiya Siddhi S. "><br><br>
        
        <label for="nim">Masukkan NIM:</label>
        <input type="text" id="nim" name="nim" placeholder="202332005"><br><br>
        
        <label for="email">Masukkan email:</label>
        <input type="email" id="email" name="email" placeholder="dayu.satiya@gmail.com"><br><br>
        
        <label>Jenis Kelamin:</label><br>
        <input type="radio" id="laki" name="kelamin" value="Laki-Laki">
        <label for="laki">Laki-Laki</label>
        <input type="radio" id="perempuan" name="kelamin" value="Perempuan">
        <label for="perempuan">Perempuan</label><br><br>
        
        <label for="agama">Agama:</label>
        <select id="agama" name="agama">
            <option value="Islam">Islam</option>
            <option value="Kristen">Kristen</option>
            <option value="Hindu">Hindu</option>
            <option value="Buddha">Buddha</option>
        </select><br><br>
        
        <label for="password">Masukkan password:</label>
        <input type="password" id="password" name="password" placeholder="admin123"><br><br>
        
        <label for="konfirmasi_password">Konfirmasi password:</label>
        <input type="password" id="konfirmasi_password" name="konfirmasi_password"><br><br>
        
        <input type="submit" value="Daftar">
    </form>
</body>
</html>
